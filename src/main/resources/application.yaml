spring:
  application:
    name: ktb-hktn-team2

  # 기본 연결 설정
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ktb_hktn_team2}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:${DB_USERNAME:root}}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  product-key:
    value: ${PRODUCT_KEY:9999}
  jwt:
    secret: ${JWT_SECRET:ktb-hktn-team2-local-dev-secret-key-please-change-me}
    access-token-expiration: ${JWT_EXPIRATION:1h}
  ai-server:
    url: ${AI_SERVER_URL:http://localhost:8000}

logging:
  level:
    org.hibernate.SQL: debug

---
# 운영 프로파일 (prod)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ktb_hktn_team2}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:${DB_USERNAME:root}}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

---
# H2 인메모리 사용 시: ./gradlew bootRun --args='--spring.profiles.active=h2'
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:ktb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
