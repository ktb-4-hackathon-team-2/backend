spring:
  application:
    name: ktb-hktn-team2

  # MySQL 기본 연결 설정 (기본 포트 3307 또는 환경변수 주입)
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ktb_hktn_team2}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  # 제품 키: 값이 일치해야 회원가입/로그인 화면에 진입할 수 있다.
  product-key:
    value: ${PRODUCT_KEY:9999}
  jwt:
    # HS256 이므로 32 bytes(=32자) 이상이어야 한다.
    secret: ${JWT_SECRET:ktb-hktn-team2-local-dev-secret-key-please-change-me}
    access-token-expiration: ${JWT_EXPIRATION:1h}
  ai-server:
    url: ${AI_SERVER_URL:http://localhost:8000}

logging:
  level:
    org.hibernate.SQL: debug

---
# H2 인메모리 사용 시: ./gradlew bootRun --args='--spring.profiles.active=h2'
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:ktb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  h2:
    console:
      enabled: true
      path: /h2-console
